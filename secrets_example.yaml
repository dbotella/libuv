# Attention: Ce fichier contient des exemples de secrets hardcodés pour des démonstrations.
# Ne jamais inclure de vrais secrets dans un fichier YAML ou tout autre endroit non sécurisé.

database:
  username: EXAMPLE_DATABASE_USERNAME
  password: EXAMPLE_DATABASE_PASSWORD

api:
  google_api_key: EXAMPLE_GOOGLE_API_KEY_REPLACE_WITH_REAL_KEY
  stripe_secret_key: EXAMPLE_STRIPE_SECRET_KEY_REPLACE_WITH_REAL_KEY

oauth:
  oauth_token: EXAMPLE_OAUTH_TOKEN_REPLACE_WITH_REAL_TOKEN

aws:
  access_key: EXAMPLE_AWS_ACCESS_KEY_REPLACE_WITH_REAL_KEY
  secret_access_key: EXAMPLE_AWS_SECRET_ACCESS_KEY_REPLACE_WITH_REAL_KEY

twilio:
  auth_token: EXAMPLE_TWILIO_AUTH_TOKEN_REPLACE_WITH_REAL_TOKEN

github:
  personal_access_token: EXAMPLE_GITHUB_PERSONAL_ACCESS_TOKEN_REPLACE_WITH_REAL_TOKEN

jwt:
  secret: EXAMPLE_JWT_SECRET_KEY_REPLACE_WITH_REAL_SECRET

encryption:
  encrypted_password: EXAMPLE_ENCRYPTED_PASSWORD_BASE64_REPLACE_WITH_REAL_VALUE

ssl:
  private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEpAIBAAKCAQEArandomstringforPrivateKeyExample...
    -----END RSA PRIVATE KEY-----
  certificate: |
    -----BEGIN CERTIFICATE-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArandomstringforSSLExample...
    -----END CERTIFICATE-----

# Attention: Ce fichier est destiné à des fins éducatives uniquement. Ne jamais utiliser dans des projets réels.

